<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Kalender · B2B Video Plan</title>
<style>
  :root {
    --bg:#0f1117; --bg2:#1a1d27; --bg3:#242837; --border:#2e3347;
    --text:#e8eaf0; --text2:#9098b0; --accent:#f5a623; --accent2:#e8910a;
    --blue:#4a90d9; --green:#4caf7d; --red:#e05c5c; --purple:#9b6fd4; --teal:#3dbfb8;
    --radius:10px; --shadow:0 8px 40px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}

  /* Topbar */
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;margin-right:8px}
  .brand-icon{font-size:22px}
  .brand h1{font-size:14px;font-weight:700;color:var(--accent)}
  .brand p{font-size:11px;color:var(--text2)}
  .month-nav{display:flex;align-items:center;gap:8px}
  .month-label{font-size:16px;font-weight:700;min-width:160px;text-align:center}
  .btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;transition:all .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0;font-size:16px}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
  .btn-primary:hover{background:var(--accent2);color:#000}
  .btn-danger{color:var(--red);border-color:transparent}
  .btn-danger:hover{border-color:var(--red);background:rgba(224,92,92,.1)}
  .spacer{flex:1}
  .toolbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* Legend / filters */
  .legend{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 24px;background:var(--bg2);border-bottom:1px solid var(--border)}
  .legend-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-right:4px}
  .pill{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;gap:6px}
  .pill .dot{width:8px;height:8px;border-radius:50%}
  .pill.active{color:var(--text);border-color:currentColor}
  .pill.inactive{opacity:.4}

  /* Calendar */
  .cal-wrap{padding:20px 24px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-head{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;text-align:center;padding:6px 0;font-weight:600}
  .cal-cell{background:var(--bg2);border:1px solid var(--border);border-radius:8px;min-height:118px;padding:6px;cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column;gap:4px;overflow:hidden}
  .cal-cell:hover{border-color:var(--accent)}
  .cal-cell.other-month{opacity:.35}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .cell-date{font-size:12px;font-weight:700;color:var(--text2);display:flex;justify-content:space-between;align-items:center}
  .cal-cell.today .cell-date{color:var(--accent)}
  .cell-add{opacity:0;font-size:14px;color:var(--accent);transition:opacity .15s}
  .cal-cell:hover .cell-add{opacity:1}
  .evt{font-size:11px;padding:3px 7px;border-radius:5px;color:#fff;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid rgba(0,0,0,.3);position:relative}
  .evt:hover{filter:brightness(1.15)}
  .evt.done-evt{opacity:.55;text-decoration:line-through}
  .evt-task-badge{position:absolute;right:4px;top:2px;font-size:9px;background:rgba(0,0,0,.35);border-radius:8px;padding:0 5px}
  .ev-P1{background:#3a6ea5} .ev-P2{background:#3a8c63} .ev-P3{background:#bd7d1a;color:#1a1a1a}
  .ev-P4{background:#7a55a8} .ev-P5{background:#2f928c} .ev-custom{background:#566080}

  /* Mini info bar */
  .infobar{display:flex;gap:20px;padding:8px 24px;background:var(--bg);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);flex-wrap:wrap}
  .infobar b{color:var(--text)}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 16px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:640px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:40px}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
  .modal-head .mh-color{width:6px;height:34px;border-radius:3px}
  .modal-head h2{font-size:16px;font-weight:700;flex:1}
  .modal-close{background:none;border:none;color:var(--text2);font-size:22px;line-height:1;padding:4px}
  .modal-close:hover{color:var(--text)}
  .modal-body{padding:20px 22px;max-height:65vh;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center}

  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);margin-bottom:5px;font-weight:600}
  .field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;outline:none;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .field textarea{min-height:64px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:560px){.row2,.row3{grid-template-columns:1fr}}

  /* Variants list */
  .list-row{display:flex;gap:8px;margin-bottom:7px;align-items:center}
  .list-row input{flex:1}
  .mini-del{background:none;border:1px solid var(--border);color:var(--text2);border-radius:6px;width:30px;height:34px;flex-shrink:0;font-size:14px}
  .mini-del:hover{border-color:var(--red);color:var(--red)}
  .add-link{background:none;border:1px dashed var(--border);color:var(--text2);padding:7px;border-radius:7px;width:100%;font-size:12px;margin-top:2px}
  .add-link:hover{border-color:var(--accent);color:var(--accent)}

  /* Tasks inside event */
  .task-block{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px}
  .task-block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .task-block-head .tbh-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text)}
  .task-prog{font-size:11px;color:var(--green)}
  .task-row{display:flex;gap:9px;align-items:center;padding:7px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;margin-bottom:6px}
  .task-check{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;color:#000}
  .task-row.done .task-check{background:var(--green);border-color:var(--green)}
  .task-row.done .task-text-in{text-decoration:line-through;color:var(--text2)}
  .task-text-in{flex:1;background:none;border:none;color:var(--text);font-size:13px;outline:none;padding:2px}
  .task-date-in{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:6px;font-size:11px;padding:3px 6px;width:120px}
  .task-tag{font-size:9px;text-transform:uppercase;letter-spacing:.5px;padding:1px 6px;border-radius:8px;background:var(--bg3);color:var(--text2)}

  .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
  .empty-cal{text-align:center;color:var(--text2);padding:40px;font-size:13px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--accent);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1}

  /* Reference drawer */
  .drawer{position:fixed;top:0;right:0;height:100vh;width:380px;max-width:90vw;background:var(--bg2);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(100%);transition:transform .25s;z-index:90;overflow-y:auto}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2)}
  .drawer-head h3{font-size:15px}
  .drawer-body{padding:18px 20px}
  .ref-card{border-radius:10px;padding:14px;border:1px solid var(--border);margin-bottom:12px}
  .ref-id{font-size:10px;font-weight:700;letter-spacing:1px;opacity:.7;text-transform:uppercase}
  .ref-card h4{font-size:14px;margin:4px 0 6px}
  .ref-card p{font-size:12px;color:var(--text2)}
  .ref-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .ref-tag{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--text2)}
  .p1{background:linear-gradient(135deg,rgba(74,144,217,.12),rgba(74,144,217,.03));border-color:rgba(74,144,217,.3)}
  .p2{background:linear-gradient(135deg,rgba(76,175,125,.12),rgba(76,175,125,.03));border-color:rgba(76,175,125,.3)}
  .p3{background:linear-gradient(135deg,rgba(245,166,35,.12),rgba(245,166,35,.03));border-color:rgba(245,166,35,.3)}
  .p4{background:linear-gradient(135deg,rgba(155,111,212,.12),rgba(155,111,212,.03));border-color:rgba(155,111,212,.3)}
  .p5{background:linear-gradient(135deg,rgba(61,191,184,.12),rgba(61,191,184,.03));border-color:rgba(61,191,184,.3)}
  .drawer-tabs{display:flex;gap:8px;margin-bottom:16px}
  .drawer-tab{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:7px;border-radius:7px;font-size:12px}
  .drawer-tab.active{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-icon">☀️</span>
    <div><h1>Content Kalender</h1><p>B2B Video Plan · SolarTech</p></div>
  </div>
  <div class="month-nav">
    <button class="btn btn-icon" onclick="changeMonth(-1)">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="btn btn-icon" onclick="changeMonth(1)">›</button>
    <button class="btn" onclick="goToday()">Heute</button>
  </div>
  <div class="spacer"></div>
  <div class="toolbtns">
    <button class="btn btn-primary" onclick="openNewEvent()">+ Neuer Termin</button>
    <button class="btn" onclick="openDrawer()">📋 Strategie & Formate</button>
    <button class="btn" onclick="exportData()">⬇ Export</button>
    <button class="btn btn-danger" onclick="resetData()">↺ Zurücksetzen</button>
  </div>
</div>

<div class="legend" id="legend"></div>

<div class="infobar">
  <span><b id="statTotal">0</b> Termine</span>
  <span><b id="statTasks">0</b> Aufgaben gesamt</span>
  <span><b id="statDone">0</b> erledigt</span>
  <span style="color:var(--accent)">💡 Tag anklicken = neuer Termin · Termin anklicken = bearbeiten</span>
</div>

<div class="cal-wrap">
  <div class="cal-grid" id="calHead"></div>
  <div class="cal-grid" id="calGrid" style="margin-top:6px"></div>
</div>

<!-- Event modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="mh-color" id="mhColor"></div>
      <h2 id="modalTitle">Termin</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="saveEvent()">Speichern</button>
      <button class="btn" onclick="closeModal()">Abbrechen</button>
      <div class="spacer"></div>
      <button class="btn btn-danger" id="deleteBtn" onclick="deleteEvent()">Löschen</button>
    </div>
  </div>
</div>

<!-- Reference drawer -->
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3>Referenz</h3>
    <button class="modal-close" onclick="closeDrawer()">×</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-tabs">
      <button class="drawer-tab active" onclick="switchDrawerTab('strategy',this)">5 Säulen</button>
      <button class="drawer-tab" onclick="switchDrawerTab('formats',this)">5 Formate</button>
    </div>
    <div id="drawerContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

function seedToEvent(p){
  const tasks = [];
  if(p.milestones){
    const m=p.milestones;
    const mk=(label,date)=>({id:uid(),text:label,date:(date&&date.startsWith("2026"))?date:"",note:(date&&!date.startsWith("2026"))?date:"",done:false});
    tasks.push(mk("Konzept",m.concept));
    tasks.push(mk("Dreh",m.shoot));
    tasks.push(mk("Schnitt",m.edit));
    tasks.push(mk("Review",m.review));
  }
  if(p.prod && p.prod.notes){
    tasks.push({id:uid(),text:"Produktion: "+p.prod.notes,date:"",note:"Anforderung",done:false});
  }
  return {
    id:p.id, date:p.date, pillar:p.pillar, format:p.format||"",
    title:p.title, hook:p.hook||"", idea:p.idea||"",
    variants:(p.variants||[]).slice(), goal:p.goal||"", cta:p.cta||"",
    location:p.prod?p.prod.location:"", equipment:p.prod?p.prod.equipment.slice():[],
    hours:p.prod?p.prod.hours:"", team:p.prod?p.prod.team:"", notes:p.prod?p.prod.notes:"",
    tasks
  };
}
function uid(){return "id"+Math.random().toString(36).slice(2,9)}

function seedAll(){ return SEED.posts.map(seedToEvent); }

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ events=JSON.parse(raw); return; }
  }catch(e){}
  events=seedAll();
  save();
}
function save(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(events)); }catch(e){}
}

// ════════════════════════════════════════════════════════════════════════════
//  CALENDAR RENDERING
// ════════════════════════════════════════════════════════════════════════════
function renderLegend(){
  const el=document.getElementById("legend");
  el.innerHTML='<span class="legend-label">Säulen:</span>'+
    ["P1","P2","P3","P4","P5","custom"].map(p=>
      `<span class="pill ${activePillars.has(p)?'active':'inactive'}" style="color:${PILLAR_HEX[p]}" onclick="togglePillar('${p}')">
        <span class="dot" style="background:${PILLAR_HEX[p]}"></span>${p==='custom'?'Eigene':p+' '+PILLAR_NAMES[p]}
      </span>`).join('');
}
function togglePillar(p){
  if(activePillars.has(p)) activePillars.delete(p); else activePillars.add(p);
  renderLegend(); renderCalendar();
}

function renderHead(){
  document.getElementById("calHead").innerHTML=DAYS.map(d=>`<div class="cal-head">${d}</div>`).join('');
}

function renderCalendar(){
  document.getElementById("monthLabel").textContent=MONTHS[viewMonth]+" "+viewYear;
  const grid=document.getElementById("calGrid");
  const first=new Date(viewYear,viewMonth,1);
  let startDow=(first.getDay()+6)%7; // Mon=0
  const start=new Date(viewYear,viewMonth,1-startDow);
  const todayStr=isoDate(new Date());
  let html="";
  for(let i=0;i<42;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const ds=isoDate(d);
    const other=d.getMonth()!==viewMonth;
    const dayEvents=events.filter(e=>e.date===ds && activePillars.has(e.pillar));
    html+=`<div class="cal-cell ${other?'other-month':''} ${ds===todayStr?'today':''}" onclick="cellClick(event,'${ds}')">
      <div class="cell-date"><span>${d.getDate()}</span><span class="cell-add">＋</span></div>
      ${dayEvents.map(e=>{
        const total=e.tasks.length, done=e.tasks.filter(t=>t.done).length;
        const allDone=total>0&&done===total;
        return `<div class="evt ev-${e.pillar} ${allDone?'done-evt':''}" onclick="event.stopPropagation();openEvent('${e.id}')" title="${esc(e.title)}">
          ${esc(e.title)}${total?`<span class="evt-task-badge">${done}/${total}</span>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }
  grid.innerHTML=html;
  updateStats();
}

function cellClick(ev,ds){ openNewEvent(ds); }

function updateStats(){
  document.getElementById("statTotal").textContent=events.length;
  let t=0,d=0; events.forEach(e=>{t+=e.tasks.length; d+=e.tasks.filter(x=>x.done).length;});
  document.getElementById("statTasks").textContent=t;
  document.getElementById("statDone").textContent=d;
}

function changeMonth(delta){
  viewMonth+=delta;
  if(viewMonth<0){viewMonth=11;viewYear--;}
  if(viewMonth>11){viewMonth=0;viewYear++;}
  renderCalendar();
}
function goToday(){ const n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth(); renderCalendar(); }

// ════════════════════════════════════════════════════════════════════════════
//  EVENT MODAL
// ════════════════════════════════════════════════════════════════════════════
let draft=null; // currently edited event copy

function openEvent(id){
  const e=events.find(x=>x.id===id); if(!e) return;
  editingId=id;
  draft=JSON.parse(JSON.stringify(e));
  renderModal(false);
}
function openNewEvent(date){
  editingId=null;
  draft={id:uid(),date:(typeof date==="string"?date:isoDate(new Date())),pillar:"custom",format:"",
    title:"",hook:"",idea:"",variants:[],goal:"",cta:"",location:"",equipment:[],hours:"",team:"",notes:"",tasks:[]};
  renderModal(true);
}

function renderModal(isNew){
  document.getElementById("modalTitle").textContent=isNew?"Neuer Termin":draft.title||"Termin bearbeiten";
  document.getElementById("mhColor").style.background=PILLAR_HEX[draft.pillar]||"#566080";
  document.getElementById("deleteBtn").style.display=isNew?"none":"";

  const total=draft.tasks.length, done=draft.tasks.filter(t=>t.done).length;

  document.getElementById("modalBody").innerHTML=`
    <div class="field"><label>Titel / Hook-Überschrift</label>
      <input id="f_title" value="${esc(draft.title)}" placeholder="Worum geht es?"></div>
    <div class="row3">
      <div class="field"><label>Datum</label><input type="date" id="f_date" value="${draft.date}"></div>
      <div class="field"><label>Säule</label>
        <select id="f_pillar">
          ${Object.keys(PILLAR_NAMES).map(p=>`<option value="${p}" ${draft.pillar===p?'selected':''}>${p==='custom'?'Eigener Termin':p+' · '+PILLAR_NAMES[p]}</option>`).join('')}
        </select></div>
      <div class="field"><label>Format</label><input id="f_format" value="${esc(draft.format)}" placeholder="z.B. F1"></div>
    </div>
    <div class="field"><label>Hook (Aufhänger)</label>
      <textarea id="f_hook" placeholder="Der erste Satz, der Aufmerksamkeit erzeugt">${esc(draft.hook)}</textarea></div>
    <div class="field"><label>Idee / Beschreibung</label>
      <textarea id="f_idea" placeholder="Konkrete Umsetzungsidee">${esc(draft.idea)}</textarea></div>

    <div class="field"><label>Varianten</label>
      <div id="variantList"></div>
      <button class="add-link" onclick="addVariant()">+ Variante hinzufügen</button></div>

    <div class="row2">
      <div class="field"><label>Ziel</label><textarea id="f_goal" placeholder="Was soll der Post erreichen?">${esc(draft.goal)}</textarea></div>
      <div class="field"><label>Call-to-Action</label><textarea id="f_cta" placeholder="Handlungsaufforderung">${esc(draft.cta)}</textarea></div>
    </div>

    <div class="field"><label>📍 Drehort</label><input id="f_location" value="${esc(draft.location)}" placeholder="Realistischer Drehort"></div>
    <div class="row3">
      <div class="field"><label>Aufwand (h)</label><input id="f_hours" value="${esc(String(draft.hours))}" placeholder="z.B. 5"></div>
      <div class="field"><label>Team (Personen)</label><input id="f_team" value="${esc(String(draft.team))}" placeholder="z.B. 3"></div>
      <div class="field"><label>&nbsp;</label><input id="f_equipdummy" value="" style="visibility:hidden"></div>
    </div>
    <div class="field"><label>🎥 Equipment (Komma-getrennt)</label>
      <input id="f_equipment" value="${esc((draft.equipment||[]).join(', '))}" placeholder="Sony A7 IV, Drohne, LED-Panel"></div>
    <div class="field"><label>⚠ Besondere Anforderungen / Notizen</label>
      <textarea id="f_notes" placeholder="Genehmigungen, Vorlaufzeiten, Risiken">${esc(draft.notes)}</textarea></div>

    <div class="task-block">
      <div class="task-block-head">
        <span class="tbh-title">✅ Aufgaben in diesem Termin</span>
        <span class="task-prog" id="taskProg">${done}/${total} erledigt</span>
      </div>
      <div id="taskList"></div>
      <button class="add-link" onclick="addTask()">+ Aufgabe hinzufügen</button>
    </div>
  `;
  renderVariants(); renderTasks();
  document.getElementById("f_pillar").addEventListener("change",e=>{
    draft.pillar=e.target.value;
    document.getElementById("mhColor").style.background=PILLAR_HEX[draft.pillar];
  });
  document.getElementById("overlay").classList.add("open");
}

function renderVariants(){
  const el=document.getElementById("variantList");
  el.innerHTML=draft.variants.map((v,i)=>`
    <div class="list-row">
      <input value="${esc(v)}" oninput="draft.variants[${i}]=this.value">
      <button class="mini-del" onclick="delVariant(${i})">×</button>
    </div>`).join('');
}
function addVariant(){ draft.variants.push(""); renderVariants(); }
function delVariant(i){ draft.variants.splice(i,1); renderVariants(); }

function renderTasks(){
  const el=document.getElementById("taskList");
  el.innerHTML=draft.tasks.map((t,i)=>`
    <div class="task-row ${t.done?'done':''}">
      <div class="task-check" onclick="toggleTask(${i})">${t.done?'✓':''}</div>
      <input class="task-text-in" value="${esc(t.text)}" oninput="draft.tasks[${i}].text=this.value" placeholder="Aufgabe…">
      ${t.note?`<span class="task-tag">${esc(t.note)}</span>`:''}
      <input class="task-date-in" type="date" value="${t.date||''}" onchange="draft.tasks[${i}].date=this.value">
      <button class="mini-del" onclick="delTask(${i})">×</button>
    </div>`).join('');
  const total=draft.tasks.length, done=draft.tasks.filter(t=>t.done).length;
  const p=document.getElementById("taskProg"); if(p) p.textContent=`${done}/${total} erledigt`;
}
function addTask(){ draft.tasks.push({id:uid(),text:"",date:"",note:"",done:false}); renderTasks(); }
function delTask(i){ draft.tasks.splice(i,1); renderTasks(); }
function toggleTask(i){ draft.tasks[i].done=!draft.tasks[i].done; renderTasks(); }

function collectDraft(){
  draft.title=val("f_title"); draft.date=val("f_date"); draft.format=val("f_format");
  draft.hook=val("f_hook"); draft.idea=val("f_idea"); draft.goal=val("f_goal"); draft.cta=val("f_cta");
  draft.location=val("f_location"); draft.hours=val("f_hours"); draft.team=val("f_team"); draft.notes=val("f_notes");
  draft.equipment=val("f_equipment").split(",").map(s=>s.trim()).filter(Boolean);
  // pillar already synced via change handler; ensure:
  draft.pillar=val("f_pillar");
}
function saveEvent(){
  collectDraft();
  if(!draft.title.trim()){ toast("Bitte einen Titel eingeben"); return; }
  if(editingId){
    const idx=events.findIndex(e=>e.id===editingId);
    events[idx]=draft;
  }else{
    events.push(draft);
  }
  save(); closeModal(); renderCalendar();
  // jump to the month of the saved event
  const d=new Date(draft.date); viewYear=d.getFullYear(); viewMonth=d.getMonth(); renderCalendar();
  toast("Gespeichert");
}
function deleteEvent(){
  if(!editingId) return;
  if(!confirm("Diesen Termin wirklich löschen?")) return;
  events=events.filter(e=>e.id!==editingId);
  save(); closeModal(); renderCalendar(); toast("Gelöscht");
}
function closeModal(){ document.getElementById("overlay").classList.remove("open"); draft=null; editingId=null; }
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });

// ════════════════════════════════════════════════════════════════════════════
//  DRAWER (Strategie & Formate)
// ════════════════════════════════════════════════════════════════════════════
function openDrawer(){ document.getElementById("drawer").classList.add("open"); switchDrawerTab('strategy',document.querySelector('.drawer-tab')); }
function closeDrawer(){ document.getElementById("drawer").classList.remove("open"); }
function switchDrawerTab(tab,btn){
  document.querySelectorAll(".drawer-tab").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  const el=document.getElementById("drawerContent");
  if(tab==='strategy'){
    el.innerHTML=SEED.pillars.map(p=>`
      <div class="ref-card p${p.id.slice(1)}">
        <div class="ref-id">${p.id}</div>
        <h4>${p.name}</h4>
        <p>${p.goal}</p>
        <div class="ref-tags">${p.types.map(t=>`<span class="ref-tag">${t}</span>`).join('')}</div>
        <p style="color:var(--green);margin-top:8px;font-size:11px">📈 ${p.kpi}</p>
      </div>`).join('');
  }else{
    el.innerHTML=SEED.formats.map(f=>`
      <div class="ref-card p${f.pillar.slice(1)}">
        <div class="ref-id">${f.id} · ${f.day}</div>
        <h4>${f.name}</h4>
        <p>${f.goal}</p>
        <p style="margin-top:6px"><b style="color:var(--text)">Inhalte:</b> ${f.content}</p>
        <p style="color:var(--accent);margin-top:6px;font-size:11px">⏱ ${f.length}</p>
      </div>`).join('');
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  EXPORT / RESET / HELPERS
// ════════════════════════════════════════════════════════════════════════════
function exportData(){
  const blob=new Blob([JSON.stringify(events,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="content-kalender-export.json"; a.click();
  URL.revokeObjectURL(url); toast("Export gestartet");
}
function resetData(){
  if(!confirm("Alle Änderungen verwerfen und auf den Original-Plan zurücksetzen?")) return;
  events=seedAll(); save(); renderCalendar(); toast("Zurückgesetzt");
}

function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function val(id){ const e=document.getElementById(id); return e?e.value:""; }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800);
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); closeDrawer(); }});

// ── INIT ──
(function init(){
  load();
  // start on the first campaign month (Juli 2026) if events exist, else today
  if(events.length){ const d=new Date(events.map(e=>e.date).sort()[0]); viewYear=d.getFullYear(); viewMonth=d.getMonth(); }
  else { const n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth(); }
  renderLegend(); renderHead(); renderCalendar();
})();
</script>
